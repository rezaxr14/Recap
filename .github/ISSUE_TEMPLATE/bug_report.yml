name: Bug report
description: Report a reproducible defect in RECAP
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste API keys, tokens, connection strings, or
        sensitive recorded agent content. Report security issues privately through the
        Security policy instead of this form.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is wrong, in one or two sentences?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the exact commands or API calls. A minimal reproduction is best.
      placeholder: |
        1. docker compose up -d postgres elasticsearch
        2. recap db migrate
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include the relevant error text, status code, or report fragment.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Recording / redaction
        - PostgreSQL / migrations
        - Elasticsearch / retrieval
        - Chunking
        - Repair compiler / validation
        - Promotion / lifecycle
        - Benchmark / evaluation
        - CLI
        - HTTP API
        - Providers / agent
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or version
      description: Output of `git rev-parse --short HEAD`, or the package version.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, Docker version, and whether this is the local Compose stack.
      placeholder: |
        OS: Windows 11
        Python: 3.12.x
        Docker: 27.x
        Services: local docker compose
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or reports
      description: Redact secrets and sensitive content. Long logs can be attached as files.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: This report contains no secrets or sensitive recorded content.
          required: true
