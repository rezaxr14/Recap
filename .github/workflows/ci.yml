name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint-and-typecheck:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests scripts

      - name: Ruff format
        run: ruff format --check src tests scripts

      - name: Mypy
        run: mypy src

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit -q

  integration:
    name: Integration and e2e (real Postgres + Elasticsearch)
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: recap
          POSTGRES_PASSWORD: recap
          POSTGRES_DB: recap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recap -d recap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.19.3
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms1g -Xmx1g
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 40

    env:
      RECAP_RUN_INTEGRATION: "1"
      RECAP_TEST_DATABASE_URL: postgresql+psycopg://recap:recap@localhost:5432/recap
      RECAP_TEST_ELASTICSEARCH_URL: http://localhost:9200
      DATABASE_URL: postgresql+psycopg://recap:recap@localhost:5432/recap
      ELASTICSEARCH_URL: http://localhost:9200

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Wait for Elasticsearch
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:9200/_cluster/health >/dev/null; then
              echo "Elasticsearch is up"
              exit 0
            fi
            sleep 2
          done
          echo "Elasticsearch did not become ready" >&2
          exit 1

      - name: Migrate database
        run: recap db migrate

      - name: Initialize search index
        run: recap search init

      - name: Report provider capabilities and health
        run: |
          recap providers
          recap doctor

      - name: Run integration and e2e tests
        run: pytest tests/integration tests/e2e -q --run-integration

      - name: Run the deterministic demo end to end
        run: recap demo run

      - name: Drain the index outbox
        run: |
          recap search outbox
          recap search drain
          recap search outbox

      - name: Run the benchmark twice and compare summaries
        run: |
          recap eval run --split dev --output benchmark/reports/repro-a
          recap eval run --split dev --output benchmark/reports/repro-b
          python scripts/check_benchmark_repro.py \
            benchmark/reports/repro-a benchmark/reports/repro-b

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-reports
          path: benchmark/reports/
          if-no-files-found: warn
          retention-days: 14
