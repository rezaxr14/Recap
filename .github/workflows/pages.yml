name: Deploy replay app

on:
  push:
    branches: ["master", "main"]
    paths:
      - "web/**"
      - "docs/evidence/real-data-bfcl-*.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # Pages must be enabled once by hand: Settings -> Pages -> Source: GitHub Actions.
      # configure-pages `enablement` needs a non-GITHUB_TOKEN credential, so it is not used.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Sync BFCL reports into the site
        run: |
          mkdir -p web/data
          cp docs/evidence/real-data-bfcl-*.json web/data/
          test "$(ls web/data/*.json | wc -l)" -ge 4

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: web

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
