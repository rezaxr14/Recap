app:
  name: recap
  environment: local
  log_level: INFO
  api_prefix: /api/v1

storage:
  postgres_url: postgresql+psycopg://recap:recap@localhost:5433/recap
  max_event_payload_bytes: 65536

elasticsearch:
  url: http://localhost:9200
  api_key: ""
  index_prefix: recap
  memories_read_alias: recap-memories-read
  memories_write_alias: recap-memories-write
  chunks_read_alias: recap-chunks-read
  chunks_write_alias: recap-chunks-write
  index_generation: 1
  chunks_index_generation: 1
  request_timeout_seconds: 5.0
  vector_dimension: 256
  hybrid_strategy: app_rrf
  rrf_k: 60

embeddings:
  # RECAP is API-first. Production semantic retrieval requires:
  #   provider: openai_compatible
  #   base_url: https://<host>/v1
  #   model_id: <real embedding model>
  #   dimension: <model dimension, must match elasticsearch.vector_dimension>
  # Set the API key via EMBEDDING_API_KEY; never commit it.
  #
  # `hashing` is a deterministic lexical feature hash, not a neural embedder.
  # It is the local-development default and reports semantic_retrieval=false.
  # `fake` is reserved for unit tests and must never satisfy real-model
  # acceptance. `sentence-transformers` loads only an existing model_path
  # directory and never downloads weights.
  provider: hashing
  model_id: recap-hashing-embedding-v1
  model_version: "1"
  dimension: 256
  batch_size: 32
  base_url: ""
  api_key: ""
  timeout_seconds: 30.0
  max_retries: 2
  retry_backoff_seconds: 0.5
  send_dimensions: false
  model_path: ""
  # Asymmetric task prefixes for models that require them (e.g. Nomic).
  # BGE-M3 and text-embedding-3-small leave these empty.
  document_prefix: ""
  query_prefix: ""
  normalize: true
  allow_degraded: false

llm:
  # Agent-facing chat role used for tool-calling runs. Disabled unless a real
  # endpoint is configured; RECAP never silently substitutes a fake model.
  # Credentials come from LLM_API_KEY (or a secret manager injected into env).
  provider: disabled
  base_url: ""
  api_key: ""
  model: ""
  timeout_seconds: 60.0
  max_retries: 2
  retry_backoff_seconds: 0.5
  temperature: 0.0
  max_tokens: 0
  structured_mode: json_schema

repair_llm:
  # Optional LLM used only for typed repair-candidate proposals. Output is
  # validated by the same schema/evidence checks as deterministic drafts and
  # must pass sandbox validation before promotion.
  # Credentials come from REPAIR_LLM_API_KEY.
  provider: disabled
  base_url: ""
  api_key: ""
  model: ""
  timeout_seconds: 60.0
  max_retries: 2
  retry_backoff_seconds: 0.5
  temperature: 0.0
  max_tokens: 0
  structured_mode: json_schema

recall:
  default_mode: outcome_aware
  lexical_candidate_k: 30
  vector_candidate_k: 30
  final_k: 5
  max_candidates: 100
  allow_unvalidated_operational_memories: false
  allow_suspect_operational_memories: false
  require_tool_match: false
  no_safe_memory_threshold: 0.35
  max_per_strategy: 2
  reranker: lexical

chunking:
  # Deterministic event-aware chunks. No model or tokenizer download.
  # naive_fixed exists only as an evaluation baseline and is never the default.
  strategy: event_aware
  version: "1"
  target_tokens: 256
  max_tokens: 512
  overlap_units: 1
  token_counter: approx_regex
  token_multiplier: 1.3
  max_chunks_per_memory: 32
  failure_window_events: 12
  include_types: [memory_card, failure_window, action_observation, validation_evidence]

reliability:
  beta_prior_alpha: 1.0
  beta_prior_beta: 1.0
  minimum_verified_outcomes_for_alert: 5
  suspect_posterior_mean_threshold: 0.55
  quarantine_posterior_mean_threshold: 0.35
  consecutive_failures_for_suspect: 3

repair_compiler:
  enabled: true
  # deterministic | llm (llm requires a configured repair_llm role)
  generator: deterministic
  max_failure_window_events: 20
  max_candidate_generation_attempts: 2
  require_validation_for_promotion: true
  max_validation_trials: 10
  max_strategy_actions: 8

memory_shift:
  enabled: true
  schema_mismatch_status: incompatible
  version_mismatch_status: suspect
  revalidation_enabled: true

evaluation:
  default_split: dev
  frozen_memory_default: true
  store_per_task_results: true
  bootstrap_samples: 2000
  random_seed: 7
