[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "recap"
version = "0.1.0"
description = "Retrieval-Enhanced Correction and Adaptive Persistence for tool-using agents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "RECAP contributors" }]
keywords = [
  "ai-agents",
  "agent-memory",
  "tool-use",
  "retrieval",
  "rag",
  "hybrid-search",
  "postgresql",
  "elasticsearch",
  "llm",
  "repair",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.38,<0.39",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "elasticsearch>=8.19,<8.20",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<1.15",
  "pyyaml>=6.0,<7",
  "typer>=0.20,<0.21",
  "httpx>=0.28,<0.29",
  "numpy>=2.1,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.24,<0.25",
  "ruff>=0.17,<0.18",
  "mypy>=1.13,<1.14",
  "types-PyYAML>=6.0,<7",
]
sentence-transformers = [
  "sentence-transformers>=3.0,<4",
]
rerank = [
  "sentence-transformers>=3.0,<4",
]

[project.scripts]
recap = "recap.cli:app"

[project.urls]
Homepage = "https://github.com/rezaxr14/Recap"
Repository = "https://github.com/rezaxr14/Recap"
Issues = "https://github.com/rezaxr14/Recap/issues"
Changelog = "https://github.com/rezaxr14/Recap/blob/master/CHANGELOG.md"
Documentation = "https://github.com/rezaxr14/Recap/blob/master/docs/README.md"
Security = "https://github.com/rezaxr14/Recap/blob/master/SECURITY.md"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Make `tests.*` importable regardless of whether pytest is invoked as a
# console script or via `python -m pytest`.
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: requires Postgres and Elasticsearch",
  "e2e: full local vertical slice",
]
filterwarnings = [
  "error::DeprecationWarning:recap.*",
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
  "ignore:The configuration option \"asyncio_default_fixture_loop_scope\":DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["recap"]
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
